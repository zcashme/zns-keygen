[package]
name = "zns-keygen"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
testnet = []

[[bin]]
name = "zns-keygen"
path = "src/main.rs"

[dependencies]
blake2b_simd = "1.0.4"
sev = { version = "8.0.0", default-features = false, features = ["snp"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hex = "0.4.3"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ureq = { version = "2", default-features = false, features = ["json"] }
secrecy = "0.8"

zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { version = "0.10.4", default-features = false }
zcash_address = "0.13.0"
zcash_primitives = { version = "0.30.0", default-features = false, features = ["transparent-inputs"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
orchard = { version = "0.15.5", default-features = false, features = ["circuit"] }
transparent = { package = "zcash_transparent", version = "0.10.0", default-features = false }
zip32 = "0.2.1"
rand = "0.8"
secp256k1 = "0.29"
zcash_script = "0.4"
