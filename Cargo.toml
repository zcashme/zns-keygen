[package]
name = "zns-keygen"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
testnet = []

[[bin]]
name = "zns-keygen"
path = "src/main.rs"

[dependencies]
blake2b_simd = "1.0.4"
hex = "0.4.3"
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
secrecy = "0.8"
zns-canon = { git = "https://github.com/zcashme/zns-canon.git", branch = "main" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

# Pinned exactly to the librustzcash 0.11.0-pre line: this is the first release
# line that knows NU7 is active on testnet (height 4465026, branch ID 0x77190ad9).
# 0.10.x signs with the NU6.3 branch ID and the node rejects it.
# Relax these pins when 0.11.0 final ships.
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
zcash_address = "=0.14.0-pre.1"
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false, features = ["transparent-inputs"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard = { version = "0.16.0", default-features = false, features = ["circuit"] }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.1", default-features = false }
zip32 = "0.3"
rand = "0.10"
secp256k1 = "0.33"
zcash_script = "0.6"

[dev-dependencies]
zcash_keys = { version = "=0.17.0-pre.1", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
